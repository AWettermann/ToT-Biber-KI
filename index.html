</style></head><body><main><header><span class="header-mascot" aria-hidden="true">🦫</span><div class="header-brand"><b>ORANIENSCHULE <span class="brand-dot">·</span> BIBER + KI</b><span class="header-sub">14 kleine Missionen · Entdecken, knobeln, staunen!</span></div><div class="track"><div id="bar"></div></div><span id="counter">0 / 14</span></header><section id="app"><p>Die Mission wird geladen …</p></section><footer>Tag der offenen Tür · Informatik</footer></main><script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&a.textContent.includes("geladen"))a.innerHTML="<p>Die Mission konnte nicht gestartet werden. Bitte die Seite neu laden.</p>";});</script><script>(()=>{"use strict";const A=document.getElementById("app"),B=document.getElementById("bar"),C=document.getElementById("counter");let started=false,s=0,order=[],sel=null,train={yes:[],no:[]},tested=new Set();const N=["Daten ordnen","Muster erkennen","Sortieren","Algorithmus","Geheimcode","Bedingungen","Datenstrukturen","KI-Regel finden","KI trainieren","Fehler entdecken","Gegenbeispiel","Daten prüfen","KI im Alltag","Finale"];const X={frog:["Frosch","🐸",1,0],snail:["Schnecke","🐌",0,0],bird:["Vogel","🐦",0,1],bee:["Biene","🐝",0,1],penguin:["Pinguin","🐧",0,0],turtle:["Schildkröte","🐢",1,0],dragon:["Drache","🐲",1,1],robot:["Roboter","🤖",0,0]};function prog(){B.style.width=(started?s/14*100:0)+"%";C.textContent=(started?s:0)+" / 14"}function msg(t,k="good"){let m=document.getElementById("msg");if(m)m.innerHTML=`<div class="result ${k}">${t}</div>`}function next(){s++;order=[];sel=null;train={yes:[],no:[]};tested=new Set();prog();render()}function map(){return `<div class="mission-top" aria-label="Fortschritt: Mission ${s+1} von 14"><span class="mission-label">MISSION ${s+1} / 14</span><div class="mission-progress">${N.map((n,i)=>`<span class="mission-dot ${i<s?"done":i===s?"current":""}" title="Mission ${i+1}: ${n}"></span>`).join("")}</div></div>`}function drag(id,t){return `<div class="dragcard${sel===id?" selected":""}" draggable="true" data-drag="${id}" data-action="select" data-id="${id}">${t}</div>`}function ord(items,L){let p=order.filter(Boolean);return `<div class="pool">${items.filter(x=>!p.includes(x)).map(x=>drag(x,L[x])).join("")}</div><div class="slots">${order.map((x,i)=>`<div class="slot" data-ord="${i}">${i+1}. ${x?drag(x,L[x]):""}</div>`).join("")}</div>`}function animal(id,state="",act="none"){return `<button class="card ${state}" data-action="${act}" data-id="${id}"><span class="pic">${X[id][1]}</span><b>${X[id][0]}</b></button>`}function ch(a,act){return `<div class="cards">${a.map(x=>`<button data-action="${act}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`}function render(){document.body.classList.toggle("welcome",!started);document.body.dataset.mission=started?String(s+1):"start";if(!started){A.innerHTML=`<div class="start-screen"><button type="button" class="start-image-button" data-action="begin" aria-label="Los geht’s! Mission starten"><img src="assets/start.png" alt="Biber vor der Oranienschule. Klicke auf Los geht’s!"></button></div>`;return}let I=map();if(s===0){order=order.length?order:[null,null,null,null];A.innerHTML=I+`<h1>1. Daten ordnen</h1><div class="stage rulebox">K vor M · N direkt nach K · L nicht zuerst · M zuletzt</div>${ord(["K","L","M","N"],{K:"Paket K",L:"Paket L",M:"Paket M",N:"Paket N"})}<button data-action="q1">Prüfen</button><div id="msg"></div>`}if(s===1)A.innerHTML=I+`<h1>2. Muster erkennen</h1><div class="stage big">A · B · B · A · B · B · A · ? · ?</div>${ch([["BB","B · B"],["AB","A · B"],["BA","B · A"]],"q2")}<div id="msg"></div>`;if(s===2){order=order.length?order:[null,null,null,null,null];A.innerHTML=I+`<h1>3. Sortieren</h1><p class="lead">Zahl aufsteigend; bei gleicher Zahl Buchstabe absteigend.</p>${ord(["A","B","C","D","E"],{A:"A: 3B",B:"B: 1C",C:"C: 3A",D:"D: 2D",E:"E: 1A"})}<button data-action="q3">Prüfen</button><div id="msg"></div>`}if(s===3)A.innerHTML=I+`<h1>4. Algorithmus</h1><p class="lead">🤖 startet unten links und schaut nach rechts. Finde den Weg zum Stern! <br><small>V = ein Feld vorwärts · L = links drehen · R = rechts drehen · 🟥 = gesperrt</small></p><div class="stage"><div class="gridgame" aria-label="Vier Reihen mit je drei Feldern, Roboter unten links, Stern oben rechts"><div>·</div><div>·</div><div class="goal">⭐</div><div class="blocked">✕</div><div>·</div><div>·</div><div>·</div><div class="blocked">✕</div><div>·</div><div class="robot">🤖</div><div>·</div><div>·</div></div></div>${ch([["a","V V L V V"],["b","V V L V V V"],["c","V V R V V"]],"q4")}<div id="msg"></div>`;if(s===4)A.innerHTML=I+`<h1>5. Geheimcode</h1><p class="lead">Jeder Buchstabe wurde um einen Platz weitergeschoben.</p><div class="stage big">A→B · B→C · C→D<br><b>EBUFO</b> → ?</div>${ch([["daten","DATEN"],["leben","LEBEN"],["biber","BIBER"]],"q5")}<div id="msg"></div>`;if(s===5)A.innerHTML=I+`<h1>6. Bedingungen</h1><div class="stage rulebox">gerade → ÷2<br>ungerade → +3</div><p class="lead">Starte bei 10. Wende die Regel dreimal an.</p>${ch([["8","8"],["4","4"],["2","2"]],"q6")}<div id="msg"></div>`;if(s===6)A.innerHTML=I+`<h1>7. Datenstrukturen</h1><p class="lead">A, dann B, dann C werden auf einen Stapel gelegt. Was kommt zuerst wieder heraus?</p><div class="stage stack"><div>📄 C</div><div>📄 B</div><div>📄 A</div></div>${ch([["CBA","C → B → A"],["ABC","A → B → C"],["BAC","B → A → C"]],"q7")}<div id="msg"></div>`;if(s===7){let ids=["dragon","robot","turtle","bird"];A.innerHTML=I+`<h1>8. KI-Regel finden</h1><p class="lead">Frosch = JA, Schnecke = NEIN. Teste weitere Beispiele.</p><div class="cards">${animal("frog","yes")}${animal("snail","no")}</div><div class="cards">${ids.map(id=>animal(id,tested.has(id)?(X[id][2]?"yes":"no"):"","test")).join("")}</div>${ch([["green","grün → JA"],["fly","fliegt → JA"],["legs","vier Beine → JA"]],"q8")}<div id="msg"></div>`}if(s===8){let ids=["bird","bee","penguin","turtle"],p=[...train.yes,...train.no];A.innerHTML=I+`<h1>9. KI trainieren</h1><p class="lead">Ordne alle Beispiele: Kann das Tier fliegen?</p><div class="lab"><div class="pool">${ids.filter(x=>!p.includes(x)).map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div><div class="train-grid"><div class="bucket" data-train="yes"><h3>Kann fliegen</h3>${train.yes.map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div><div class="machine">🤖<small>Training</small></div><div class="bucket" data-train="no"><h3>Kann nicht fliegen</h3>${train.no.map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div></div></div><button data-action="q9">Training prüfen</button><div id="msg"></div>`}if(s===9)A.innerHTML=I+`<h1>10. Fehler entdecken</h1><p class="lead">Die KI kennt nur Biene und Vogel als fliegende Tiere. Beide sind klein. Sie lernt falsch: <b>klein → fliegt</b>.</p><p>Welches Beispiel korrigiert den Fehler besonders gut?</p><div class="cards">${animal("snail","","bias")}${animal("dragon","","bias")}${animal("turtle","","bias")}</div><div id="msg"></div>`;if(s===10)A.innerHTML=I+`<h1>11. Gegenbeispiel</h1><p class="lead">„Alles mit Flügeln kann fliegen.“ Welches Tier widerlegt die Regel?</p><div class="cards">${animal("bird","","counter")}${animal("penguin","","counter")}${animal("bee","","counter")}</div><div id="msg"></div>`;if(s===11)A.innerHTML=I+`<h1>12. Daten prüfen</h1><p class="lead">Welche Daten eignen sich am besten, um herauszufinden, ob Kinder gern Fahrrad fahren?</p><div class="stage">A: 5 Kinder aus einer Fahrrad-AG<br><br>B: 100 Kinder aus verschiedenen Klassen<br><br>C: 1 Kind</div>${ch([["A","A"],["B","B"],["C","C"]],"q12")}<div id="msg"></div>`;if(s===12)A.innerHTML=I+`<h1>13. KI im Alltag</h1><p class="lead">Welche Aufgabe kann eine KI besonders gut aus vielen Beispielen lernen?</p>${ch([["weather","Wetter ohne Messdaten erraten"],["photo","Auf Fotos Hunde und Katzen unterscheiden"],["feeling","Sicher wissen, wie ein fremder Mensch sich fühlt"]],"q13")}<div id="msg"></div>`;if(s===13)A.innerHTML=I+`<h1>14. Finale</h1><p class="lead">Welche Aussage stimmt?</p>${ch([["magic","KI weiß automatisch alles."],["learn","KI lernt Muster aus Beispielen und kann Fehler machen."],["always","KI entscheidet immer richtig."]],"q14")}<div id="msg"></div>`;if(s===14){B.style.width="100%";C.textContent="14 / 14";A.innerHTML=`<img class="final-image" src="assets/finale.png" alt="Mission geschafft – herzlich willkommen an der Oranienschule"><div class="final-actions"><button data-action="restart">Noch einmal spielen</button></div>`}}function po(id,i){let old=order.indexOf(id);if(old>=0)order[old]=null;order[i]=id;sel=null;render()}function pt(id,w){train.yes=train.yes.filter(x=>x!==id);train.no=train.no.filter(x=>x!==id);train[w].push(id);sel=null;render()}A.addEventListener("dragstart",e=>{let x=e.target.closest("[data-drag]");if(x)e.dataTransfer.setData("text/plain",x.dataset.drag)});A.addEventListener("dragover",e=>{if(e.target.closest("[data-ord],[data-train]"))e.preventDefault()});A.addEventListener("drop",e=>{let o=e.target.closest("[data-ord]"),t=e.target.closest("[data-train]"),id=e.dataTransfer.getData("text/plain");if(o){e.preventDefault();po(id,+o.dataset.ord)}if(t){e.preventDefault();pt(id,t.dataset.train)}});A.addEventListener("click",e=>{let a=e.target.closest("[data-action]");if(!a){let o=e.target.closest("[data-ord]"),t=e.target.closest("[data-train]");if(sel&&o)po(sel,+o.dataset.ord);if(sel&&t)pt(sel,t.dataset.train);return}let q=a.dataset.action,v=a.dataset.v,id=a.dataset.id;if(q==="begin"){started=true;render();return}if(q==="restart"){started=false;s=0;prog();render();return}if(q==="select"){sel=sel===id?null:id;render();return}let ok={q1:order.join(",")==="K,N,L,M",q2:v==="BB",q3:order.join(",")==="B,E,D,A,C",q4:v==="b",q5:v==="daten",q6:v==="4",q7:v==="CBA",q8:v==="green",q12:v==="B",q13:v==="photo",q14:v==="learn"};if(q==="test"){tested.add(id);render();msg(`Die KI sagt: <b>${X[id][2]?"JA":"NEIN"}</b>`);return}if(q==="q9"){let all=[...train.yes,...train.no];if(all.length<4){msg("Ordne zuerst alle vier Beispiele zu.","bad");return}if(train.yes.every(x=>X[x][3])&&train.no.every(x=>!X[x][3]))next();else msg("Mindestens ein Tier liegt falsch.","bad");return}if(q==="bias"){id==="snail"?next():msg("Gesucht ist ein kleines Tier, das nicht fliegen kann.","bad");return}if(q==="counter"){id==="penguin"?next():msg("Dieses Tier widerlegt die Regel nicht.","bad");return}if(q in ok){ok[q]?next():msg("Noch nicht – probiere es noch einmal.","bad")}});prog();render()})();</script></body></html>
