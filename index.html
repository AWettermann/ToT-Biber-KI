<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oranienschule · Biber + KI</title><style>*{box-sizing:border-box}:root{--ink:#213b49;--green:#63c784;--orange:#ffb53e}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(#ddf4ff,#f8fcff,#e8f7e6)}main{max-width:1050px;margin:auto;padding:16px}header{display:flex;align-items:center;gap:14px}.track{height:11px;background:#c9e0e9;flex:1;border-radius:20px;overflow:hidden}#bar{height:100%;background:var(--green);width:0;transition:.4s}#app{margin-top:18px;background:#fff;border:2px solid #b7dce9;border-radius:20px;padding:clamp(18px,4vw,38px);box-shadow:0 15px 40px #54798c25}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.2em 0}.lead{font-size:1.15rem;line-height:1.5}.tag{font-weight:900;color:#147b9e}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:18px 0}.room{border:2px solid #badce7;border-radius:13px;padding:10px;background:#f7fcfe;min-height:92px}.room.done{background:#eaf8e9;border-color:#78c489}.room.current{border-color:#f0b23d;background:#fff8df}.room.locked{opacity:.42}.room h3{font-size:.9rem;margin:5px 0}.room-num{font-size:.68rem;font-weight:900}.stage,.lab{background:#eff9fc;border:2px solid #c4e3ed;border-radius:16px;padding:18px;margin:18px 0}.rulebox{border-left:5px solid #45b6d9}button{font:inherit;font-weight:800;padding:13px 18px;border:0;border-radius:11px;background:var(--orange);color:#543000;cursor:pointer;margin:5px;box-shadow:0 3px 0 #c37a13}.cards,.pool,.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.card,.dragcard{background:#fff;border:3px solid #a9cbd8;border-radius:14px;padding:12px;text-align:center;min-width:115px}.dragcard{cursor:grab;font-weight:900}.selected{outline:4px solid #ffb43b}.yes{background:#eaf8e9;border-color:#6fc17d}.no{background:#fff0ef;border-color:#e78c8c}.pic{font-size:3rem;display:block}.slot,.bucket{min-width:130px;min-height:90px;border:3px dashed #97b9c7;border-radius:14px;padding:8px;text-align:center;background:#fbfeff}.train-grid{display:grid;grid-template-columns:1fr 110px 1fr;gap:12px}.machine{display:grid;place-items:center;text-align:center;font-size:2.5rem}.result{padding:15px;border-radius:13px;font-weight:800;margin-top:12px}.good{background:#fff3b8;border:3px solid #64b982}.bad{background:#fff0df;border:2px solid #e4a05a}.gridgame{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.gridgame div{width:64px;height:64px;display:grid;place-items:center;background:#edf6f9;border:2px solid #b5d3df;border-radius:8px;font-size:2rem}.big{text-align:center;font-size:1.6rem;line-height:1.5}.stack{max-width:250px;margin:auto;text-align:center}.stack div{background:white;border:2px solid #9bbfce;padding:9px;margin:3px;border-radius:8px}.final-image{width:100%;display:block;border-radius:16px}.final-actions{text-align:center;margin-top:18px}footer{text-align:center;margin:14px;color:#6b8490;font-size:.8rem}@media(max-width:650px){.train-grid{grid-template-columns:1fr}.map{grid-template-columns:repeat(2,1fr)}}
.start-screen{position:relative;max-width:960px;margin:0 auto}.start-screen img{width:100%;display:block;border-radius:16px}.start-hotspot{position:absolute;left:32%;top:71%;width:36%;height:20%;background:transparent!important;border:0!important;box-shadow:none!important;cursor:pointer;opacity:0}.start-hotspot:focus-visible{opacity:1;outline:4px solid #ffbc38;background:#ffffff55!important;border-radius:12px}.start-subtitle{text-align:center;margin:16px auto 24px}

.start-action{text-align:center;margin:18px auto}.start-action button{font-size:1.2rem;padding:16px 32px;cursor:pointer;min-height:54px}.start-hotspot{z-index:3;cursor:pointer}

body.welcome header{display:none}body.welcome #app{margin-top:0;padding:0;border:0;background:transparent;box-shadow:none}body.welcome main{max-width:1100px}.start-screen{margin:0 auto;max-width:1000px}.start-image-button{display:block;width:100%;padding:0;margin:0;border:0;border-radius:16px;background:transparent;box-shadow:none;overflow:hidden;cursor:pointer;line-height:0}.start-image-button img{display:block;width:100%;height:auto}.start-image-button:hover{filter:brightness(1.04)}.start-image-button:focus-visible{outline:5px solid #ffb53e;outline-offset:5px}body.welcome footer{display:none}
</style></head><body><main><header><b>ORANIENSCHULE · BIBER + KI</b><div class="track"><div id="bar"></div></div><span id="counter">0 / 14</span></header><section id="app"><p>Die Mission wird geladen …</p></section><footer>Tag der offenen Tür · Informatik</footer></main><script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&a.textContent.includes("geladen"))a.innerHTML="<p>Die Mission konnte nicht gestartet werden. Bitte die Seite neu laden.</p>";});</script><script>(()=>{"use strict";const A=document.getElementById("app"),B=document.getElementById("bar"),C=document.getElementById("counter");let started=false,s=0,order=[],sel=null,train={yes:[],no:[]},tested=new Set();const N=["Daten ordnen","Muster erkennen","Sortieren","Algorithmus","Geheimcode","Bedingungen","Datenstrukturen","KI-Regel finden","KI trainieren","Fehler entdecken","Gegenbeispiel","Daten prüfen","KI im Alltag","Finale"];const X={frog:["Frosch","🐸",1,0],snail:["Schnecke","🐌",0,0],bird:["Vogel","🐦",0,1],bee:["Biene","🐝",0,1],penguin:["Pinguin","🐧",0,0],turtle:["Schildkröte","🐢",1,0],dragon:["Drache","🐲",1,1],robot:["Roboter","🤖",0,0]};function prog(){B.style.width=(started?s/14*100:0)+"%";C.textContent=(started?s:0)+" / 14"}function msg(t,k="good"){let m=document.getElementById("msg");if(m)m.innerHTML=`<div class="result ${k}">${t}</div>`}function next(){s++;order=[];sel=null;train={yes:[],no:[]};tested=new Set();prog();render()}function map(){return `<div class="map">${N.map((n,i)=>`<div class="room ${i<s?"done":i===s?"current":"locked"}"><div class="room-num">MISSION ${i+1}</div><h3>${n}</h3>${i<s?"✓":i===s?"Jetzt lösen":"Gesperrt"}</div>`).join("")}</div>`}function drag(id,t){return `<div class="dragcard${sel===id?" selected":""}" draggable="true" data-drag="${id}" data-action="select" data-id="${id}">${t}</div>`}function ord(items,L){let p=order.filter(Boolean);return `<div class="pool">${items.filter(x=>!p.includes(x)).map(x=>drag(x,L[x])).join("")}</div><div class="slots">${order.map((x,i)=>`<div class="slot" data-ord="${i}">${i+1}. ${x?drag(x,L[x]):""}</div>`).join("")}</div>`}function animal(id,state="",act="none"){return `<button class="card ${state}" data-action="${act}" data-id="${id}"><span class="pic">${X[id][1]}</span><b>${X[id][0]}</b></button>`}function ch(a,act){return `<div class="cards">${a.map(x=>`<button data-action="${act}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`}function render(){document.body.classList.toggle("welcome",!started);if(!started){A.innerHTML=`<div class="start-screen"><button type="button" class="start-image-button" data-action="begin" aria-label="Los geht’s! Mission starten"><img src="assets/start.png" alt="Biber vor der Oranienschule. Klicke auf Los geht’s!"></button></div>`;return}let I=`<span class="tag">BIBER + KI · ORANIENSCHULE</span>${map()}`;if(s===0){order=order.length?order:[null,null,null,null];A.innerHTML=I+`<h1>1. Daten ordnen</h1><div class="stage rulebox">K vor M · N direkt nach K · L nicht zuerst · M zuletzt</div>${ord(["K","L","M","N"],{K:"Paket K",L:"Paket L",M:"Paket M",N:"Paket N"})}<button data-action="q1">Prüfen</button><div id="msg"></div>`}if(s===1)A.innerHTML=I+`<h1>2. Muster erkennen</h1><div class="stage big">A · B · B · A · B · B · A · ? · ?</div>${ch([["BB","B · B"],["AB","A · B"],["BA","B · A"]],"q2")}<div id="msg"></div>`;if(s===2){order=order.length?order:[null,null,null,null,null];A.innerHTML=I+`<h1>3. Sortieren</h1><p class="lead">Zahl aufsteigend; bei gleicher Zahl Buchstabe absteigend.</p>${ord(["A","B","C","D","E"],{A:"A: 3B",B:"B: 1C",C:"C: 3A",D:"D: 2D",E:"E: 1A"})}<button data-action="q3">Prüfen</button><div id="msg"></div>`}if(s===3)A.innerHTML=I+`<h1>4. Algorithmus</h1><p class="lead">🤖 startet unten links und schaut nach rechts. Rot ist gesperrt.</p><div class="stage"><div class="gridgame"><div>⬜</div><div>⬜</div><div>⭐</div><div>🟥</div><div>⬜</div><div>⬜</div><div>⬜</div><div>🟥</div><div>⬜</div><div>🤖</div><div>⬜</div><div>⬜</div></div></div>${ch([["a","V V L V V"],["b","V L V V R V"],["c","V V R V V"]],"q4")}<div id="msg"></div>`;if(s===4)A.innerHTML=I+`<h1>5. Geheimcode</h1><p class="lead">Jeder Buchstabe wurde um einen Platz weitergeschoben.</p><div class="stage big">A→B · B→C · C→D<br><b>EBUFO</b> → ?</div>${ch([["daten","DATEN"],["leben","LEBEN"],["biber","BIBER"]],"q5")}<div id="msg"></div>`;if(s===5)A.innerHTML=I+`<h1>6. Bedingungen</h1><div class="stage rulebox">gerade → ÷2<br>ungerade → +3</div><p class="lead">Starte bei 10. Wende die Regel dreimal an.</p>${ch([["8","8"],["4","4"],["2","2"]],"q6")}<div id="msg"></div>`;if(s===6)A.innerHTML=I+`<h1>7. Datenstrukturen</h1><p class="lead">A, dann B, dann C werden auf einen Stapel gelegt. Was kommt zuerst wieder heraus?</p><div class="stage stack"><div>📄 C</div><div>📄 B</div><div>📄 A</div></div>${ch([["CBA","C → B → A"],["ABC","A → B → C"],["BAC","B → A → C"]],"q7")}<div id="msg"></div>`;if(s===7){let ids=["dragon","robot","turtle","bird"];A.innerHTML=I+`<h1>8. KI-Regel finden</h1><p class="lead">Frosch = JA, Schnecke = NEIN. Teste weitere Beispiele.</p><div class="cards">${animal("frog","yes")}${animal("snail","no")}</div><div class="cards">${ids.map(id=>animal(id,tested.has(id)?(X[id][2]?"yes":"no"):"","test")).join("")}</div>${ch([["green","grün → JA"],["fly","fliegt → JA"],["legs","vier Beine → JA"]],"q8")}<div id="msg"></div>`}if(s===8){let ids=["bird","bee","penguin","turtle"],p=[...train.yes,...train.no];A.innerHTML=I+`<h1>9. KI trainieren</h1><p class="lead">Ordne alle Beispiele: Kann das Tier fliegen?</p><div class="lab"><div class="pool">${ids.filter(x=>!p.includes(x)).map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div><div class="train-grid"><div class="bucket" data-train="yes"><h3>Kann fliegen</h3>${train.yes.map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div><div class="machine">🤖<small>Training</small></div><div class="bucket" data-train="no"><h3>Kann nicht fliegen</h3>${train.no.map(x=>drag(x,X[x][1]+" "+X[x][0])).join("")}</div></div></div><button data-action="q9">Training prüfen</button><div id="msg"></div>`}if(s===9)A.innerHTML=I+`<h1>10. Fehler entdecken</h1><p class="lead">Die KI kennt nur Biene und Vogel als fliegende Tiere. Beide sind klein. Sie lernt falsch: <b>klein → fliegt</b>.</p><p>Welches Beispiel korrigiert den Fehler besonders gut?</p><div class="cards">${animal("snail","","bias")}${animal("dragon","","bias")}${animal("turtle","","bias")}</div><div id="msg"></div>`;if(s===10)A.innerHTML=I+`<h1>11. Gegenbeispiel</h1><p class="lead">„Alles mit Flügeln kann fliegen.“ Welches Tier widerlegt die Regel?</p><div class="cards">${animal("bird","","counter")}${animal("penguin","","counter")}${animal("bee","","counter")}</div><div id="msg"></div>`;if(s===11)A.innerHTML=I+`<h1>12. Daten prüfen</h1><p class="lead">Welche Daten eignen sich am besten, um herauszufinden, ob Kinder gern Fahrrad fahren?</p><div class="stage">A: 5 Kinder aus einer Fahrrad-AG<br><br>B: 100 Kinder aus verschiedenen Klassen<br><br>C: 1 Kind</div>${ch([["A","A"],["B","B"],["C","C"]],"q12")}<div id="msg"></div>`;if(s===12)A.innerHTML=I+`<h1>13. KI im Alltag</h1><p class="lead">Welche Aufgabe kann eine KI besonders gut aus vielen Beispielen lernen?</p>${ch([["weather","Wetter ohne Messdaten erraten"],["photo","Auf Fotos Hunde und Katzen unterscheiden"],["feeling","Sicher wissen, wie ein fremder Mensch sich fühlt"]],"q13")}<div id="msg"></div>`;if(s===13)A.innerHTML=I+`<h1>14. Finale</h1><p class="lead">Welche Aussage stimmt?</p>${ch([["magic","KI weiß automatisch alles."],["learn","KI lernt Muster aus Beispielen und kann Fehler machen."],["always","KI entscheidet immer richtig."]],"q14")}<div id="msg"></div>`;if(s===14){B.style.width="100%";C.textContent="14 / 14";A.innerHTML=`<img class="final-image" src="assets/finale.png" alt="Mission geschafft – herzlich willkommen an der Oranienschule"><div class="final-actions"><button data-action="restart">Noch einmal spielen</button></div>`}}function po(id,i){let old=order.indexOf(id);if(old>=0)order[old]=null;order[i]=id;sel=null;render()}function pt(id,w){train.yes=train.yes.filter(x=>x!==id);train.no=train.no.filter(x=>x!==id);train[w].push(id);sel=null;render()}A.addEventListener("dragstart",e=>{let x=e.target.closest("[data-drag]");if(x)e.dataTransfer.setData("text/plain",x.dataset.drag)});A.addEventListener("dragover",e=>{if(e.target.closest("[data-ord],[data-train]"))e.preventDefault()});A.addEventListener("drop",e=>{let o=e.target.closest("[data-ord]"),t=e.target.closest("[data-train]"),id=e.dataTransfer.getData("text/plain");if(o){e.preventDefault();po(id,+o.dataset.ord)}if(t){e.preventDefault();pt(id,t.dataset.train)}});A.addEventListener("click",e=>{let a=e.target.closest("[data-action]");if(!a){let o=e.target.closest("[data-ord]"),t=e.target.closest("[data-train]");if(sel&&o)po(sel,+o.dataset.ord);if(sel&&t)pt(sel,t.dataset.train);return}let q=a.dataset.action,v=a.dataset.v,id=a.dataset.id;if(q==="begin"){started=true;render();return}if(q==="restart"){started=false;s=0;prog();render();return}if(q==="select"){sel=sel===id?null:id;render();return}let ok={q1:order.join(",")==="K,N,L,M",q2:v==="BB",q3:order.join(",")==="B,E,D,A,C",q4:v==="b",q5:v==="daten",q6:v==="4",q7:v==="CBA",q8:v==="green",q12:v==="B",q13:v==="photo",q14:v==="learn"};if(q==="test"){tested.add(id);render();msg(`Die KI sagt: <b>${X[id][2]?"JA":"NEIN"}</b>`);return}if(q==="q9"){let all=[...train.yes,...train.no];if(all.length<4){msg("Ordne zuerst alle vier Beispiele zu.","bad");return}if(train.yes.every(x=>X[x][3])&&train.no.every(x=>!X[x][3]))next();else msg("Mindestens ein Tier liegt falsch.","bad");return}if(q==="bias"){id==="snail"?next():msg("Gesucht ist ein kleines Tier, das nicht fliegen kann.","bad");return}if(q==="counter"){id==="penguin"?next():msg("Dieses Tier widerlegt die Regel nicht.","bad");return}if(q in ok){ok[q]?next():msg("Noch nicht – probiere es noch einmal.","bad")}});prog();render()})();</script></body></html>
